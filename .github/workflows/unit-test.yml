name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
